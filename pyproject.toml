[project]
name = "strata"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.0.2",
    "channels>=4.3.2",
    "cryptography>=47.0.0",
    "daphne>=4.2.2",
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "duckdb>=1.1.0",
    "libtorrent>=2.0.11",
    "pygeohash>=3.2.2",
    "pytest>=9.0.3",
    "typer>=0.25.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
strata = "strata.cli:app"
