[package]
name = "handshake-core"
version = "0.1.0"
edition = "2021"
authors = ["Carlos A. Crespo <lvccrespo@gmail.com>"]
description = "Core cryptographic engine, sovereign triad schemas, and P2P protocol primitives for Handshake"
license = "GPL-3.0-or-later"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
hex = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.4"
sha1 = "0.10"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
