name: Documentation Consistency & Architectural Drift Verifier

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'web/**'
      - 'README.md'
      - 'scripts/verify_docs_consistency.py'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'web/**'
      - 'README.md'
      - 'scripts/verify_docs_consistency.py'

jobs:
  verify-docs:
    name: Verify Documentation Consistency & Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Verify Documentation Consistency
        run: uv run python scripts/verify_docs_consistency.py
